<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <header class="page-header">
    <div><h1>Employee Management</h1><p>Manage your company employees.</p></div>
    <button id="showFormBtn" type="button">Add employee</button>
  </header>

  <section class="panel" id="formPanel" hidden>
    <h2 id="formTitle">Add employee</h2>
    <form id="employeeForm" novalidate>
      <input type="hidden" id="employeeId">
      <div class="form-grid">
        <label>Name<input id="name" type="text" required></label>
        <label>Email<input id="email" type="email" required></label>
        <label>Age (18–65)<input id="age" type="number" min="18" max="65" step="1" required></label>
        <label>Department
          <select id="department" required>
            <option value="">Choose department</option>
            <option>IT</option><option>HR</option><option>Finance</option>
          </select>
        </label>
        <label>Salary<input id="salary" type="number" min="0" step="0.01" required></label>
        <label>Hours worked<input id="hoursWorked" type="number" min="0" step="0.5" value="0" required></label>
        <label>Bonus<input id="bonus" type="number" min="0" step="0.01" value="0" required></label>
        <label>Joined at<input id="joinedAt" type="date"></label>
        <label class="checkbox-label"><input id="active" type="checkbox" checked> Active employee</label>
        <label class="wide">Skills <span class="hint">Separate with commas</span>
          <input id="skills" type="text" placeholder="JavaScript, Node.js, MongoDB">
        </label>
      </div>
      <p id="formError" class="error" role="alert"></p>
      <div class="form-actions">
        <button id="saveBtn" type="submit">Save employee</button>
        <button id="cancelBtn" class="secondary" type="button">Cancel</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="list-header"><h2>Employees</h2><span id="employeeCount">0 employees</span></div>
    <div class="filters">
      <input id="searchInput" type="search" placeholder="Search by name or email">
      <select id="departmentFilter" autocomplete="off">
        <option value="">All departments</option>
        <option>IT</option><option>HR</option><option>Finance</option>
      </select>
      <select id="statusFilter" autocomplete="off">
        <option value="all">All statuses</option>
        <option value="active">Active only</option>
        <option value="inactive">Inactive only</option>
      </select>
      <button id="refreshBtn" class="secondary" type="button">Refresh</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Employee</th><th>Department</th><th>Age</th><th>Salary</th><th>Bonus</th>
          <th>Hours</th><th>Joined</th><th>Skills</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="employeesTable"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
